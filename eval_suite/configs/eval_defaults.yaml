logdir_label: gait-conditioned-agility/pretrain-v0/train
sim_device: cuda:0
headless: true

gait: [0.5, 0.0, 0.0]
step_frequency: 3.0
footswing_height: 0.08
body_height_cmd: 0.0
pitch_cmd: 0.0
roll_cmd: 0.0
stance_width_cmd: 0.25

# 速度搜索：0.2 m/s 粒度（二分约 4–5 次 trial）；变体内复用 env
speed_min: 0.0
speed_max: 4.0
speed_precision: 0.2
speed_tracking_threshold: 0.3
speed_episode_steps: 60
speed_warmup_steps: 15
speed_steady_steps: 30

yaw_test_vx: 1.5
yaw_test_vy: 0.0
yaw_test_wz: 0.0

stability_vx: 1.5
stability_vy: 0.0
stability_wz: 0.0
stability_episode_steps: 60
stability_warmup_steps: 15
stability_steady_steps: 35

sym_pool: eval_suite/assets/symmetric_v64
asym_pool: eval_suite/assets/full_asym_v64
baseline_urdf: resources/robots/go1/urdf/go1.urdf

num_variants: 16
speed_search_coarse_only: false
